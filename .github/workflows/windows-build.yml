# Builds the SoftwareFactory desktop app for Windows, then tests the installed app end to end.
# - Every pull request: build, keep the installers as a workflow artifact, and run the smoke test
#   (scripts/smoke/windows-smoke.mjs): silent install, old-database upgrade, launch, Bridge window
#   reaches the core, one practice build to a tagged repo, Data vault, kill mid-run and resume,
#   normal close, portable zip.
# - Every push to main (or a manual run): also publish them to the rolling "latest" release,
#   only after the smoke test passed, so the download links below never hold a broken build:
#   https://github.com/PlonterAsi/SoftwareFactory/releases/download/latest/SoftwareFactory-setup.exe
#   https://github.com/PlonterAsi/SoftwareFactory/releases/download/latest/SoftwareFactory.msi
#   https://github.com/PlonterAsi/SoftwareFactory/releases/download/latest/SoftwareFactory-portable.zip
# - In-app updates (docs/updates.md): each build gets its own version, 0.2.<run number>. With the
#   TAURI_SIGNING_PRIVATE_KEY secret set, the installer is signed for the updater and the release
#   also carries latest.json, which installed apps read to update themselves. The smoke test also
#   installs an older build and proves it updates itself to this one.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every build is a new version, so the installed app can tell it is behind.
  SF_VERSION: 0.2.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      # Ship Node.js inside the app, so a fresh PC needs nothing else installed.
      # The same node.exe that just ran the tests, with its MIT license next to it.
      - name: Bundle Node.js
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          New-Item -ItemType Directory -Force src-tauri/node | Out-Null
          Copy-Item $node src-tauri/node/node.exe
          $lic = Join-Path (Split-Path $node) "LICENSE"
          if (Test-Path $lic) { Copy-Item $lic src-tauri/node/LICENSE } else { Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/v$((node -p 'process.versions.node'))/LICENSE" -OutFile src-tauri/node/LICENSE }
          node -p "'bundled node ' + process.version"

      # This build's version; with the updater key, also the signed updater artifact (setup.exe.sig).
      - name: Version and updater signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then sign=true; else sign=false; echo "::warning title=Updates not signed::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so this build publishes no update (latest.json). See docs/updates.md."; fi
          echo "{\"version\": \"$SF_VERSION\", \"bundle\": {\"createUpdaterArtifacts\": $sign}}" > src-tauri/tauri.ci.json
          cat src-tauri/tauri.ci.json

      # Runs `npm run build` first (beforeBuildCommand), then compiles and bundles.
      # tauri.ship-node.json adds the bundled Node.js to the installer's resources.
      - run: npx tauri build --config src-tauri/tauri.ship-node.json --config src-tauri/tauri.ci.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers under stable names
        shell: pwsh
        run: |
          $b = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem "$b/nsis/*-setup.exe" | Select-Object -First 1).FullName out/SoftwareFactory-setup.exe
          Copy-Item (Get-ChildItem "$b/msi/*.msi" | Select-Object -First 1).FullName out/SoftwareFactory.msi
          # The updater signature, when this build was signed: the app checks it against the key in tauri.conf.json.
          $sig = Get-ChildItem "$b/nsis/*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName out/SoftwareFactory-setup.exe.sig
            node scripts/updates/verify-sig.mjs out/SoftwareFactory-setup.exe out/SoftwareFactory-setup.exe.sig src-tauri/tauri.conf.json
            if ($LASTEXITCODE -ne 0) { throw "The TAURI_SIGNING_PRIVATE_KEY secret does not match the public key in tauri.conf.json, so installed apps would refuse this update." }
          }
          Set-Content -NoNewline out/version.txt $env:SF_VERSION
          # Portable: the exe finds its core in a "core" folder next to it.
          New-Item -ItemType Directory -Force portable/SoftwareFactory/core | Out-Null
          Copy-Item src-tauri/target/release/softwarefactory.exe portable/SoftwareFactory/SoftwareFactory.exe
          Copy-Item -Recurse packages/core/dist/* portable/SoftwareFactory/core/
          Copy-Item packages/core/package.json portable/SoftwareFactory/core/
          New-Item -ItemType Directory -Force portable/SoftwareFactory/node | Out-Null
          Copy-Item src-tauri/node/* portable/SoftwareFactory/node/
          Compress-Archive -Path portable/SoftwareFactory -DestinationPath out/SoftwareFactory-portable.zip
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SoftwareFactory-windows
          path: out/*

      # For the smoke test only (never published): the same app as an older version, 0.0.1, that
      # looks for updates on the test's own local server and trusts a throwaway key made right here.
      # The smoke test signs this build's installer with that key and serves it, so the whole update
      # path runs for real, with or without the project's own updater secret.
      - name: Build an older version to update from
        shell: bash
        run: |
          mkdir -p smoke-update
          npx tauri signer generate --ci -p "" -w smoke-update/throwaway.key > /dev/null
          pub=$(cat smoke-update/throwaway.key.pub)
          cat > src-tauri/tauri.old.json <<JSON
          {
            "version": "0.0.1",
            "build": { "beforeBuildCommand": "" },
            "bundle": { "createUpdaterArtifacts": false },
            "plugins": { "updater": { "pubkey": "$pub", "endpoints": ["http://127.0.0.1:4399/latest.json"], "dangerousInsecureTransportProtocol": true } }
          }
          JSON
          npx tauri build --config src-tauri/tauri.ship-node.json --config src-tauri/tauri.old.json --bundles nsis
          cp "$(ls src-tauri/target/release/bundle/nsis/*_0.0.1_*-setup.exe | head -1)" smoke-update/SoftwareFactory-old-setup.exe
          npx tauri signer sign -f smoke-update/throwaway.key -p "" out/SoftwareFactory-setup.exe
          mv out/SoftwareFactory-setup.exe.sig smoke-update/SoftwareFactory-setup.exe.testsig
          [ -f smoke-update/SoftwareFactory-setup.exe.testsig ] && node scripts/updates/verify-sig.mjs out/SoftwareFactory-setup.exe smoke-update/SoftwareFactory-setup.exe.testsig "$pub"
          rm smoke-update/throwaway.key
          ls -la smoke-update

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-update
          path: smoke-update/*

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: SoftwareFactory-windows
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: smoke-update
          path: smoke-update

      - name: Smoke test the installed app
        run: node scripts/smoke/windows-smoke.mjs --installer out/SoftwareFactory-setup.exe --portable out/SoftwareFactory-portable.zip --old-installer smoke-update/SoftwareFactory-old-setup.exe --update-sig smoke-update/SoftwareFactory-setup.exe.testsig --version ${{ env.SF_VERSION }} --out smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            smoke-out/*.md
            smoke-out/*.log
            smoke-out/*.png

  publish:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoftwareFactory-windows
          path: out

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # Where downloads and updates live: this repo while it is public. With the RELEASES_TOKEN secret
      # set, the public repo PlonterAsi/SoftwareFactory-releases instead (installers and latest.json
      # only, no code), so this repo can be private and installed apps still update without a sign-in.
      - name: Publish to the "latest" release
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then
            export GH_TOKEN="$RELEASES_TOKEN" GH_REPO="${{ github.repository_owner }}/SoftwareFactory-releases"; target=()
          else
            export GH_TOKEN="${{ github.token }}" GH_REPO="${{ github.repository }}"; target=(--target "$GITHUB_SHA")
          fi
          echo "publishing to $GH_REPO"
          notes="SoftwareFactory v$SF_VERSION: Windows build of main at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)), smoke-tested as an installed app on Windows before publishing. Ships its own Node.js. For real agents install Claude Code and sign in; Git is needed to ship apps. Unsigned: Windows SmartScreen will warn, choose More info, then Run anyway. Installed apps from v0.2 on update themselves (Systems, Updates)."
          # The manifest installed apps read to update themselves; only for a signed build.
          if [ -f out/SoftwareFactory-setup.exe.sig ]; then
            node scripts/updates/manifest.mjs --version "$SF_VERSION" --sig out/SoftwareFactory-setup.exe.sig \
              --url "https://github.com/$GH_REPO/releases/download/latest/SoftwareFactory-setup.exe" \
              --notes "Build of main at ${GITHUB_SHA::7}: $(git log -1 --format=%s 2>/dev/null || echo latest changes)" --out out/latest.json
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "SoftwareFactory v$SF_VERSION (latest main)" --notes "$notes" --prerelease "${target[@]}"
