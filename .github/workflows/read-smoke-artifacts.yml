# Temporary: prints the core logs of two failed smoke runs into the job log (diagnosis of the launch freeze).
name: read-smoke-artifacts
on:
  push:
    branches: [claude/project-thread-zrd3sm]
    paths: [.github/workflows/read-smoke-artifacts.yml]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: ["43061496250", "42961804707"]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-test-results
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: a
      - run: |
          ls -la a || true
          for f in a/*.log a/*.md; do echo "=================== $f"; cat "$f"; done
