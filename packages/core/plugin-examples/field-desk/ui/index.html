<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field desk</title>
<link rel="stylesheet" href="/plugins/_sdk/sf.css">
<style>
  .cols{display:grid;grid-template-columns:minmax(220px,1fr) minmax(320px,2fr);gap:12px;align-items:start}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  .list{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
  .list li{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .list li[aria-selected="true"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
  .list li:focus-visible{outline:1px solid var(--accent)}
  input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
  form{display:grid;gap:8px;margin-top:12px}
  .line{display:grid;grid-template-columns:120px 1fr;gap:8px}
  .said{margin-top:8px;min-height:20px}
  td button{padding:2px 8px}
</style>
</head>
<body>
<h1>Field desk</h1>
<p class="muted">Real projects and tickets. What you do here is done in SoftwareFactory and marked as done by this add-on.</p>
<div class="cols">
  <div class="card">
    <h3>Projects</h3>
    <ul class="list" id="projects" role="listbox" aria-label="Projects"></ul>
  </div>
  <div class="card">
    <h3 id="ticketsTitle">Tickets</h3>
    <table><thead><tr><th>Key</th><th>Title</th><th>Kind</th><th>Status</th><th></th></tr></thead><tbody id="tickets"></tbody></table>
    <form id="open">
      <div class="line">
        <select id="kind" aria-label="Kind"><option>task</option><option>bug</option><option>request</option><option>idea</option><option>question</option></select>
        <input id="title" placeholder="A new ticket in this project" aria-label="Ticket title" required>
      </div>
      <div><button type="submit">Open ticket</button></div>
    </form>
    <div class="said" id="said" role="status"></div>
  </div>
</div>
<script src="/plugins/_sdk/sf.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var projects = [], current = null;
  function say(text, bad) { $("said").textContent = text; $("said").className = "said " + (bad ? "bad" : "good"); }
  function el(tag, text, attrs) { var e = document.createElement(tag); if (text != null) e.textContent = text; for (var k in attrs || {}) e.setAttribute(k, attrs[k]); return e; }

  function showProjects() {
    var ul = $("projects"); ul.textContent = "";
    if (!projects.length) ul.appendChild(el("li", "No projects yet"));
    projects.forEach(function (p) {
      var li = el("li", null, { role: "option", tabindex: "0", "aria-selected": String(current === p.id) });
      li.appendChild(el("span", p.name)); li.appendChild(el("span", p.status, { class: "muted mono" }));
      var pick = function () { current = p.id; showProjects(); loadTickets(); };
      li.onclick = pick; li.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
      ul.appendChild(li);
    });
  }
  function loadTickets() {
    var p = projects.find(function (x) { return x.id === current; });
    $("ticketsTitle").textContent = p ? "Tickets in " + p.name : "Tickets";
    return sf.records("tickets", { limit: 2000 }).then(function (all) {
      var rows = all.filter(function (t) { return t.project === current && t.status !== "closed"; });
      var body = $("tickets"); body.textContent = "";
      if (!rows.length) { var tr = el("tr"); tr.appendChild(el("td", "No open tickets here", { colspan: "5", class: "muted" })); body.appendChild(tr); }
      rows.forEach(function (t) {
        var tr = el("tr");
        tr.appendChild(el("td", t.key, { class: "mono" })); tr.appendChild(el("td", t.title)); tr.appendChild(el("td", t.kind)); tr.appendChild(el("td", t.status));
        var td = el("td"), b = el("button", "Note");
        b.onclick = function () {
          var text = $("title").value.trim();
          if (!text) { say("Write the note in the box first, then press Note on the ticket.", true); $("title").focus(); return; }
          sf.act("ticket.note", { id: t.id, text: text }).then(function () { $("title").value = ""; say("Note added to " + t.key + "."); }, function (e) { say(e.message, true); });
        };
        td.appendChild(b); tr.appendChild(td); body.appendChild(tr);
      });
    });
  }
  $("open").onsubmit = function (e) {
    e.preventDefault();
    if (current == null) return say("Pick a project first.", true);
    sf.act("ticket.open", { title: $("title").value, kind: $("kind").value, project: current })
      .then(function (t) { $("title").value = ""; say("Opened " + t.key + "."); return loadTickets(); }, function (err) { say(err.message, true); });
  };
  sf.records("projects").then(function (list) {
    projects = list.filter(function (p) { return p.status !== "archived"; });
    current = projects.length ? projects[0].id : null;
    showProjects();
    if (current != null) loadTickets();
  }, function (e) { say(e.message, true); });
})();
</script>
</body>
</html>
